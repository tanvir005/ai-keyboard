# XcodeGen spec — the single source of truth for the Xcode project.
#
# The .xcodeproj is NOT committed. Regenerate it with:
#     cd ios && xcodegen generate
#
# Rationale: .pbxproj is an unmergeable plist blob that cannot be authored
# correctly without Xcode. This YAML can be written from any machine, and
# both CI and the Mac regenerate an identical project from it.

name: Nib

options:
  bundleIdPrefix: com.feinapps
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# Secret build settings (NIB_OPENAI_KEY, NIB_OPENAI_MODEL) come from this
# gitignored file so they never reach git. It must exist for `xcodegen generate`
# to succeed — copy Secrets.xcconfig.example to Secrets.xcconfig to create it.
configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "" # set locally in Xcode; left empty so CI can build unsigned
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    TARGETED_DEVICE_FAMILY: "1" # iPhone only for v1

    # Where the keyboard sends text for AI edits, and the shared token it
    # sends with it. Both are copied into each target's Info.plist below and
    # read by `NibBackend`.
    #
    # Empty is a valid, supported state: the app builds and runs entirely on
    # `StubAPIClient`, exactly as it did before the backend existed. Set
    # NIB_API_BASE_URL to a deployment root (no trailing path) to switch Fix
    # over to the live service.
    #
    # NIB_APP_SECRET is not authentication — it ships inside the app and can be
    # read out of the IPA. It only stops a scanner draining an open endpoint.
    NIB_API_BASE_URL: "https://ai-keyboard-two.vercel.app"
    NIB_APP_SECRET: ""

    # OpenAI, called directly from the keyboard for Rewrite / Tone / Translate.
    #
    # NIB_OPENAI_KEY and NIB_OPENAI_MODEL are NOT set here on purpose: this file
    # is committed, and a live `sk-...` key does not belong in git history. They
    # come from Secrets.xcconfig instead (see `configFiles` below), which is
    # gitignored. Copy Secrets.xcconfig.example to Secrets.xcconfig and paste
    # your key there. Leave it empty and those three tools stay on the stub.
    #
    # WARNING: the key still ships inside the built app and is extractable from
    # the IPA, billable to whoever owns it until rotated. That is the deliberate
    # trade in `OpenAIClient`. Prefer a restricted, low-limit key, rotate freely.

packages:
  NibKit:
    path: NibKit

targets:
  # ---------------------------------------------------------------
  # Host app — onboarding, Home, History, Presets, Settings, Paywall
  # ---------------------------------------------------------------
  Nib:
    type: application
    platform: iOS
    sources:
      - path: Nib
    dependencies:
      - package: NibKit
        product: NibKit
      - target: NibKeyboard
        embed: true
        codeSign: true
    settings:
      base:
        # The registered App ID, spelled the way the developer portal has it —
        # the same typo as the App Group, and correct for the same reason. It
        # has to sit under the team's own prefix or automatic signing has
        # nothing to match and refuses to sign.
        PRODUCT_BUNDLE_IDENTIFIER: com.feinapps.aikeybord
        PRODUCT_NAME: Nib
        CODE_SIGN_ENTITLEMENTS: Nib/Nib.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
    info:
      path: Nib/Info.plist
      properties:
        CFBundleDisplayName: Nib
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        NibAPIBaseURL: $(NIB_API_BASE_URL)
        NibAppSecret: $(NIB_APP_SECRET)
        NibOpenAIKey: $(NIB_OPENAI_KEY)
        NibOpenAIModel: $(NIB_OPENAI_MODEL)

  # ---------------------------------------------------------------
  # Keyboard extension — the actual custom keyboard + AI toolbar
  # ---------------------------------------------------------------
  NibKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: NibKeyboard
    dependencies:
      - package: NibKit
        product: NibKit
    settings:
      base:
        # Must be the app's identifier plus one component. Xcode refuses to
        # embed an extension whose identifier is not prefixed by its parent's,
        # and the error names the binary rather than saying which of the two
        # is wrong — which is how these two drift apart unnoticed.
        PRODUCT_BUNDLE_IDENTIFIER: com.feinapps.aikeybord.keyboard
        PRODUCT_NAME: NibKeyboard
        CODE_SIGN_ENTITLEMENTS: NibKeyboard/NibKeyboard.entitlements
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: NibKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Nib
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            # Without this the "Allow Full Access" toggle never appears in
            # iOS Settings at all — and with it off, no network call from the
            # extension process is permitted by the OS.
            RequestsOpenAccess: true
        NibAPIBaseURL: $(NIB_API_BASE_URL)
        NibAppSecret: $(NIB_APP_SECRET)
        NibOpenAIKey: $(NIB_OPENAI_KEY)
        NibOpenAIModel: $(NIB_OPENAI_MODEL)

schemes:
  Nib:
    build:
      targets:
        Nib: all
        NibKeyboard: all
    run:
      config: Debug
    # NibKit's unit tests are pure-Swift and run via `swift test` inside
    # ios/NibKit (no simulator, no Xcode) — see .github/workflows/ios-build.yml.
