name: iOS

# The code in this repo is authored on Windows, where Xcode does not exist.
# This workflow is the compiler check that would otherwise be missing: every
# push gets a real build of both targets plus the NibKit unit tests, so build
# breaks are caught here rather than on the Mac.
#
# Deliberately no `paths:` filter. Path filtering does not reliably match on the
# push that first creates a branch, and a CI check that silently skips is worse
# than no check at all when the author cannot compile locally.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # macos-15, not macos-14. Current XcodeGen writes project format
    # objectVersion 77, which Xcode 15.4 (the macos-14 default) refuses to open
    # with "a future Xcode project file format". macos-15 ships Xcode 16.
    # A Mac building this repo needs Xcode 16+ for the same reason.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: |
          xcodegen generate --spec project.yml
          test -d Nib.xcodeproj || { echo "::error::xcodegen produced no ios/Nib.xcodeproj"; exit 1; }

      # Pure-logic tests — no simulator needed. TextContextResolver lives here
      # precisely so its boundary math is verifiable without a device.
      - name: Test NibKit
        working-directory: ios/NibKit
        run: swift test

      - name: Build app and keyboard extension
        id: build
        working-directory: ios
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build \
            -project Nib.xcodeproj \
            -scheme Nib \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/xcodebuild.log

      # Raw job logs need admin rights to download, but annotations are readable
      # by anyone. Re-emitting each compiler error as an annotation means a
      # failure explains itself without opening the Actions tab.
      - name: Surface compile errors
        if: always()
        run: |
          if [ -f /tmp/xcodebuild.log ]; then
            grep -E "error:" /tmp/xcodebuild.log \
              | sed 's|.*/ios/|ios/|' \
              | sort -u | head -60 \
              | while IFS= read -r line; do echo "::error::${line}"; done
          fi
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "Build failed — see annotations above."
            exit 1
          fi

  # The backend gets the same treatment the app does, for the same reason: it is
  # authored on a machine that cannot run it. A typecheck is not a test, but it
  # catches the class of mistake most likely here — three provider SDKs whose
  # exact call shapes are easy to misremember.
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      # Types alone let a handler written to the wrong calling convention
      # through — it typechecks perfectly against itself. This runs the
      # endpoint over a real HTTP server. No key, no network.
      - name: Smoke-test the endpoint
        working-directory: backend
        run: npm run smoke
