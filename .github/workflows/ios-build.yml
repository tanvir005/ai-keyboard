name: iOS

# The code in this repo is authored on Windows, where Xcode does not exist.
# This workflow is the compiler check that would otherwise be missing: every
# push gets a real build of both targets plus the NibKit unit tests, so build
# breaks are caught here rather than on the Mac.
# Deliberately no `paths:` filter. Path filtering does not reliably match on the
# push that first creates a branch, and a CI check that silently skips is worse
# than no check at all when the author cannot compile locally. Everything in
# this repo is iOS today; the extra minutes are cheap insurance.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          echo "which: $(which xcodegen || echo NOT-FOUND)"
          xcodegen --version || echo "version check failed"

      - name: Generate Xcode project
        working-directory: ios
        run: |
          set -x
          xcodegen generate --spec project.yml
          echo "--- ios/ contents after generate ---"
          ls -la
          echo "--- any .xcodeproj anywhere in repo ---"
          find "$GITHUB_WORKSPACE" -maxdepth 3 -name "*.xcodeproj" -print
          # Fail loudly and early rather than letting xcodebuild report a
          # confusing "unable to read project" several steps later.
          test -d Nib.xcodeproj || { echo "::error::xcodegen did not produce ios/Nib.xcodeproj"; exit 1; }

      # Pure-logic tests — no simulator needed. TextContextResolver lives here
      # precisely so its boundary math is verifiable without a device.
      - name: Test NibKit
        working-directory: ios/NibKit
        run: swift test

      - name: Build app and keyboard extension
        id: build
        working-directory: ios
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build \
            -project Nib.xcodeproj \
            -scheme Nib \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/xcodebuild.log

      # Raw job logs need admin rights to download, but annotations are readable
      # by anyone. Re-emitting each compiler error as an annotation means a
      # failure explains itself without anyone opening the Actions tab.
      - name: Surface compile errors
        if: always()
        run: |
          if [ -f /tmp/xcodebuild.log ]; then
            grep -E "error:" /tmp/xcodebuild.log \
              | sed 's|.*/ios/|ios/|' \
              | sort -u | head -60 \
              | while IFS= read -r line; do echo "::error::${line}"; done
          fi
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "Build failed — see annotations above."
            exit 1
          fi
